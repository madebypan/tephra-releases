name: Publish Tephra release

on:
  push:
    branches:
      - "release/v*"

concurrency:
  group: tephra-public-release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out release payload
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Validate release payload
        id: release
        shell: bash
        run: |
          set -euo pipefail
          version="$(jq -r '.version // empty' payload/latest.json)"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([+-][0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::payload/latest.json has an invalid version"
            exit 1
          fi
          tag="v$version"
          if [[ "$GITHUB_REF" != "refs/heads/release/$tag" ]]; then
            echo "::error::Release branch and manifest version do not match"
            exit 1
          fi
          archive="Tephra_${version}_universal.app.tar.gz"
          required=(
            payload/Tephra.dmg
            payload/latest.json
            "payload/$archive"
            "payload/$archive.sig"
          )
          for file in "${required[@]}"; do
            if [[ ! -s "$file" ]]; then
              echo "::error::Missing or empty release asset: $file"
              exit 1
            fi
          done
          node --input-type=module -e '
            import { readFileSync } from "node:fs";
            const manifest = JSON.parse(readFileSync("payload/latest.json", "utf8"));
            const version = manifest.version;
            const archive = `Tephra_${version}_universal.app.tar.gz`;
            const expectedUrl = `https://github.com/madebypan/tephra-releases/releases/download/v${version}/${archive}`;
            const expectedSignature = readFileSync(`payload/${archive}.sig`, "utf8").trim();
            const platforms = Object.keys(manifest.platforms ?? {}).sort();
            if (platforms.join(",") !== "darwin-aarch64,darwin-x86_64") {
              throw new Error("Updater manifest must contain exactly the two macOS architectures");
            }
            for (const platform of ["darwin-aarch64", "darwin-x86_64"]) {
              const entry = manifest.platforms?.[platform];
              if (entry?.url !== expectedUrl || entry?.signature !== expectedSignature) {
                throw new Error(`Invalid updater entry: ${platform}`);
              }
            }
          '
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "archive=$archive" >> "$GITHUB_OUTPUT"

      - name: Prepare idempotent public release
        id: existing
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag }}
          ARCHIVE: ${{ steps.release.outputs.archive }}
        run: |
          set -euo pipefail
          if ! release_json="$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isDraft 2>/dev/null)"; then
            echo "published=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [[ "$(jq -r '.isDraft' <<<"$release_json")" == "true" ]]; then
            gh release delete "$TAG" --repo "$GITHUB_REPOSITORY" --yes
            echo "published=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          existing="$RUNNER_TEMP/existing-release"
          mkdir -p "$existing"
          gh release download "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --dir "$existing" \
            --pattern Tephra.dmg \
            --pattern latest.json \
            --pattern "$ARCHIVE" \
            --pattern "$ARCHIVE.sig"
          for asset in Tephra.dmg latest.json "$ARCHIVE" "$ARCHIVE.sig"; do
            if ! cmp --silent "payload/$asset" "$existing/$asset"; then
              echo "::error::A different published asset already exists for $TAG: $asset"
              exit 1
            fi
          done
          echo "published=true" >> "$GITHUB_OUTPUT"

      - name: Create draft public GitHub release
        if: ${{ steps.existing.outputs.published != 'true' }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.release.outputs.version }}
          TAG: ${{ steps.release.outputs.tag }}
          ARCHIVE: ${{ steps.release.outputs.archive }}
        run: |
          set -euo pipefail
          gh release create "$TAG" \
            payload/Tephra.dmg \
            payload/latest.json \
            "payload/$ARCHIVE" \
            "payload/$ARCHIVE.sig" \
            --repo "$GITHUB_REPOSITORY" \
            --target main \
            --title "Tephra $TAG" \
            --notes "Signed and notarized Tephra build for macOS 13 or newer. Download from https://tephranote.com." \
            --draft

      - name: Verify staged public assets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag }}
          ARCHIVE: ${{ steps.release.outputs.archive }}
        run: |
          set -euo pipefail
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isDraft,assets --jq '
            [.assets[].name]
            | if (index("Tephra.dmg") and index("latest.json") and index(env.ARCHIVE) and index(env.ARCHIVE + ".sig"))
              then .
              else error("missing public release assets")
              end
          ' >/dev/null

      - name: Publish verified GitHub release
        if: ${{ steps.existing.outputs.published != 'true' }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          set -euo pipefail
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false --latest

      - name: Verify anonymous public downloads
        shell: bash
        env:
          TAG: ${{ steps.release.outputs.tag }}
          ARCHIVE: ${{ steps.release.outputs.archive }}
        run: |
          set -euo pipefail
          base="https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG"
          for asset in Tephra.dmg latest.json "$ARCHIVE" "$ARCHIVE.sig"; do
            curl --fail --location --silent --show-error \
              --retry 5 --retry-all-errors --retry-delay 2 --head \
              "$base/$asset" --output /dev/null
          done

      - name: Remove temporary release branch
        if: success()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          branch="${GITHUB_REF#refs/heads/}"
          gh api --method DELETE "repos/$GITHUB_REPOSITORY/git/refs/heads/$branch"
